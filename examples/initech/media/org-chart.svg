    <rect x="10" y="184" width="120" height="40" rx="6"/><rect x="135" y="184" width="120" height="40" rx="6"/><rect x="260" y="184" width="120" height="40" rx="6"/><rect x="385" y="184" width="120" height="40" rx="6"/><rect x="510" y="184" width="120" height="40" rx="6"/>
