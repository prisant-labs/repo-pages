<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif" font-size="13">
  <title>Initech org chart</title>
  <rect width="640" height="300" fill="#f7f7f5"/>
  <g stroke="#8a8f99" stroke-width="2" fill="none">
    <path d="M320 64 V96"/><path d="M320 136 V160 H70 V184 M320 160 H195 V184 M320 160 V184 M320 160 H445 V184 M320 160 H570 V184"/>
