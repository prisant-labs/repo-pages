<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply requisition</title>
<style>
  :root { --ink: #22262e; --muted: #6b6f78; --line: #d8d4c8; --paper: #fbf8f0; --accent: #2b5d8a; --bad: #b42318; --good: #1f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 Georgia, "Times New Roman", serif; background: #e9e5da; color: var(--ink); padding: 24px 16px; }
  .sheet { max-width: 640px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); padding: 28px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  .sub { color: var(--muted); margin: 2px 0 20px; font-size: .9rem; }
  label { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--line); background: #fff; border-radius: 3px; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  button { margin-top: 18px; font: inherit; padding: 9px 18px; background: var(--accent); color: #fff; border: 0; border-radius: 3px; cursor: pointer; }
  .msg { margin-top: 14px; padding: 10px 12px; border-left: 4px solid; display: none; }
  .msg.bad { display: block; border-color: var(--bad); color: var(--bad); background: #fdecea; }
  .msg.good { display: block; border-color: var(--good); color: var(--good); background: #e9f6ee; }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: .9rem; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .stamp { float: right; border: 2px solid var(--bad); color: var(--bad); padding: 2px 8px; transform: rotate(-6deg); font-weight: 700; font-size: .8rem; }
</style>
</head>
<body>
<div class="sheet">
  <span class="stamp">COVER SHEET REQUIRED</span>
  <h1>Supply requisition</h1>
  <p class="sub">Initech Facilities. Orders filled on Tuesdays.</p>
  <form id="f">
    <label for="who">Requested by</label>
    <input id="who" required placeholder="Your name">
    <div class="row">
      <div><label for="item">Item</label>
        <select id="item"><option>Pens</option><option>Paper</option><option>Toner</option><option>Stapler</option><option>Red stapler</option></select></div>
      <div><label for="qty">Quantity</label><input id="qty" type="number" min="1" value="1"></div>
    </div>
    <label for="why">Reason</label>
    <textarea id="why" rows="2" placeholder="Why you need it"></textarea>
    <label><input id="cover" type="checkbox" style="width:auto"> I attached a cover sheet</label>
    <button>Submit requisition</button>
  </form>
  <div id="msg" class="msg" role="status"></div>
  <table><thead><tr><th>#</th><th>Who</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead><tbody id="log"></tbody></table>
</div>
<script>
  const RULES = { "Pens": 10, "Paper": 50, "Toner": 1, "Stapler": 1, "Red stapler": 0 };
  let n = 0;
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const who = document.getElementById("who").value.trim(), item = document.getElementById("item").value;
    const qty = +document.getElementById("qty").value, cover = document.getElementById("cover").checked;
    const msg = document.getElementById("msg");
    let status, ok = false;
    if (!cover) status = "Returned: no cover sheet";
    else if (item === "Red stapler") status = "Pending: forwarded to Bill";
    else if (qty > RULES[item]) status = `Denied: limit is ${RULES[item]}`;
    else { status = "Approved for Tuesday"; ok = true; }
    msg.className = "msg " + (ok ? "good" : "bad"); msg.textContent = status;
    document.getElementById("log").insertAdjacentHTML("afterbegin", `<tr><td>${++n}</td><td>${who.replace(/</g, "&lt;")}</td><td>${item}</td><td>${qty}</td><td>${status}</td></tr>`);
  };
</script>
</body>
</html>
