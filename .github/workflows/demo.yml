# Tests the generator, builds the Initech demo from this commit's viewer and generator,
# and runs the browser checks on the result. It also checks the setup page against the
# code it copies its rules from. Pushes to main then publish the demo to
# https://projects.prisantlabs.com/repo-pages/ and the setup page to /repo-pages/setup/.
# The org site owns that domain, and GitHub serves this repository's Pages site under it.
#
# Pull requests have no path filter, because the "Protect main" ruleset requires the
# build check. A filtered workflow would never report on a docs-only pull request,
# and that pull request could never merge.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'generator/**'
      - 'examples/**'
      - 'tests/**'
      - 'setup/**'
      - 'templates/**'
      - 'action.yml'
      - '.github/workflows/demo.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build this repository with the action
        id: action
        uses: ./
        with:
          deploy: 'false'

      - name: Check what the action built
        env:
          SITE: ${{ steps.action.outputs.site_path }}
        run: |
          test -f "$SITE/index.html"
          test -f "$SITE/site-data.json"
          test -f "$SITE/README.md"
          test -d "$SITE/_viewer/vendor"
          test ! -e "$SITE/.github"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the generator
        run: python generator/test_build_site.py

      - name: Build the demo
        run: python examples/build_demo.py --viewer viewer --generator generator/build_site.py

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium

      # The demo inlines marked and DOMPurify, so its checks cannot see a broken loader
      # path. The site the action built loads them by URL, as every published site does.
      - name: Check that Markdown renders on the site the action built
        env:
          SITE: ${{ steps.action.outputs.site_path }}
        run: node tests/run_render_check.mjs "$SITE" "#/p/README.md"

      - name: Run the browser checks
        run: node tests/run_browser_checks.mjs

      - name: Add the setup page to the demo
        run: |
          mkdir -p _site/setup
          cp setup/index.html _site/setup/index.html

      # Runs on the copy, so it also proves the page is in the artifact.
      - name: Check the setup page against the code it copies
        run: node tests/run_setup_checks.mjs _site/setup

      - name: Upload the demo
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
