# Reports new versions of the workflow actions and the vendored viewer libraries.
#
# The npm entry reads .github/vendor-watch/package.json, which nothing installs. Its pull
# requests are expected to fail CI: a generator test stops until viewer/vendor holds the
# new version. Treat one as a signal to follow viewer/vendor/README.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /.github/vendor-watch
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
