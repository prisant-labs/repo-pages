<title>Repo Pages setup</title>
<!--
  The repo-pages setup page. It writes the files an adopter commits to publish a repository.
  One self-contained file. It loads nothing from the network and sends nothing anywhere.
  Its rules are copied from templates/repo-pages.yml, action.yml, generator/build_site.py and
  generator/preflight.py. tests/run_setup_checks.mjs compares them with those files on every pull request.
  Storage keys use the rps. prefix, because the page shares an origin with the demo and the rp. keys are the viewer's.
-->
<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem("rps.theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<script>
"use strict";
/* ═════════════ Real rules, copied from the repository. tests/run_setup_checks.mjs compares them with the code ═════════════ */
// generator/build_site.py
const DEFAULT_EXCLUDE = [".github/**", "**/.DS_Store", "**/.gitkeep"];
const RESERVED = ["index.html", "site-data.json"];
const VIEWER_DIR = "_viewer";
const REGULAR_MODES = ["100644", "100755"];
const CONFIG_FILE = ".github/repo-pages.json";
const CONFIG_TYPES = [ // [key, JS check, wording from CONFIG_TYPES]
  ["title", v => typeof v === "string", "a string"],
  ["description", v => typeof v === "string", "a string"],
  ["exclude", v => Array.isArray(v) && v.every(p => typeof p === "string"), "a list of strings"],
  ["includeHidden", v => typeof v === "boolean", "true or false"],
  ["sandboxHtml", v => typeof v === "boolean", "true or false"]
];
// The latest release. After each release, set both values: the tag, and git rev-parse vX.Y.Z^{commit}.
const RELEASE = { tag: "v1.2.0", sha: "9764d5ac92c2567e7591e913b2ae94b1403518bc" };
const FIRST_RELEASE = "v1.0.0";

/* ═════════════ The option registry: one entry per option, used by the form, the outputs and the inventory ═════════════ */
// where: input (action.yml), config (.github/repo-pages.json), workflow (the workflow file), context (facts about the repository, never written),
//        tool (a choice about this page's output only)
// since: the release that added an action input. A pinned commit or a fork from before it ignores the input.
const OPTIONS = [
  // Repository facts
  { id: "repo", sec: "repo", where: "context", type: "text", def: "initech/intranet", label: "Repository", hint: "owner/name. Used in the summary and in the action's messages. Never written to a file.", source: "generator/preflight.py" },
  { id: "repoVis", sec: "repo", where: "context", type: "seg", def: "public", values: [["public", "Public"], ["private", "Private"], ["internal", "Internal"]], label: "Repository visibility", hint: "GitHub reports a repository with internal visibility as private, and the action treats it so.", source: "generator/preflight.py" },
  { id: "siteVis", sec: "repo", where: "context", type: "seg", def: "public", values: [["public", "Public"], ["private", "Private"], ["unknown", "Not reported"]], label: "GitHub Pages site visibility", hint: "A site is public on the internet unless your plan has private sites (GitHub Enterprise Cloud). Not reported counts as public.", source: "generator/preflight.py, README FAQ" },

  // Action inputs

// Python's json.dumps with default settings: ", " and ": " separators, non-ASCII escaped.
function pyDumps(v) {

// generator/build_site.py glob_to_regex: gitignore-style, ** spans folders, * and ? stay inside one, anchored at both ends.
function globToRegex(pattern) {

    else if (cps[i] === "*") { out += "[^/]*"; i += 1; }
    else if (cps[i] === "?") { out += "[^/]"; i += 1; }

}

// Lint a user pattern for the mistakes gitignore habits cause.
function lintPattern(p) {
  const out = [];
  if (p === "") out.push("An empty pattern matches nothing.");
  if (p.startsWith("/")) out.push(`Paths have no leading slash, so this never matches. Try "${p.replace(/^\/+/, "")}".`);
  if (p.endsWith("/")) out.push(`A pattern must match a file path, so a trailing slash never matches. Try "${p}**".`);
  if (p.startsWith("!")) out.push("Negation is not supported. The ! is matched as a literal character.");
  if (/[\[\]]/.test(p)) out.push("Character classes are not supported. [ and ] are matched literally.");
  if (p.includes("\\")) out.push("A backslash is matched literally. Use / between folders.");
  if (!p.includes("/") && /\*/.test(p) && !p.startsWith("**")) out.push(`Without a folder, * stays at the top level, unlike .gitignore. Try "**/${p}" to match it in every folder.`);
  if (p && !/[*?/]/.test(p) && !p.includes(".")) out.push(`This matches only a top-level file named exactly "${p}". For a folder, try "${p}/**".`);
  if (p === "**" || p === "**/*") out.push("This excludes every file.");
  return out;
}

  OPTIONS.forEach(o => {
    const el = document.getElementById("f-" + o.id); if (!el) return;
    el.value = o.type === "list" ? S[o.id].join("\n") : S[o.id];
  });
}

/* ═════════════ Rendering: outputs ═════════════ */
const TABS = [["summary", "Summary"], ["workflow", "repo-pages.yml"], ["config", "repo-pages.json"], ["dependabot", "dependabot.yml"], ["checks", "Checks"], ["inventory", "Inventory"]];
let activeTab = "summary";
try { const t = JSON.parse(localStorage.getItem("rps.tab")); if (TABS.some(([id]) => id === t)) activeTab = t; } catch (e) {}
function hl(text, kind) {
  return text.split("\n").map(line => {
    const e = esc(line);
    if (kind === "yaml") {
      if (/^\s*#/.test(line)) return `<span class="c">${e}</span>`;
      return e.replace(/^(\s*-?\s*)([\w.-]+)(:)/, '$1<span class="k">$2</span>$3').replace(/( # [\w.]+)$/, '<span class="c">$1</span>').replace(/(&#39;[^&]*&#39;)/g, '<span class="s">$1</span>');
    }
    return e.replace(/^(\s*)(&quot;[^&]+&quot;)(:)/, '$1<span class="k">$2</span>$3');
  }).join("\n");
}
function fileBlock(name, text, kind, dl) {
  return `<div class="file-head"><span class="file-name">${esc(name)}</span><div class="btn-row"><button class="btn primary" data-copy="${dl}">Copy</button><button class="btn" data-download="${dl}">Download</button></div></div><pre class="code" id="code-${dl}">${hl(text, kind)}</pre>`;
}
let OUT = {};
function renderOutputs() {
  const fe = fieldErrors(S);
  const wf = buildWorkflow(S), cfgObj = configObject(S), cfgText = Object.keys(cfgObj).length ? formatJson(cfgObj) : "", dep = buildDependabot(S);
  OUT = { workflow: { name: "repo-pages.yml", path: ".github/workflows/repo-pages.yml", text: wf }, config: { name: "repo-pages.json", path: ".github/repo-pages.json", text: cfgText }, dependabot: { name: "dependabot.yml", path: ".github/dependabot.yml", text: dep } };
  const list = LIST_TEXT ? classify(parseList(LIST_TEXT).rows, S) : null;
  const C = checks(S, list);
  const nStop = C.filter(c => c.lv === "stop").length, nWarn = C.filter(c => c.lv === "warn").length;
  $("#tabs").innerHTML = TABS.map(([id, name]) => {
    let cnt = "";
    if (id === "checks") cnt = nStop ? `<span class="cnt stop">${nStop}</span>` : nWarn ? `<span class="cnt warn">${nWarn}</span>` : "";
    if (id === "config" && !cfgText) cnt = `<span class="cnt">none</span>`;
    if (id === "dependabot" && !dep) cnt = `<span class="cnt">none</span>`;
    return `<button class="tab${id === activeTab ? " active" : ""}" role="tab" aria-selected="${id === activeTab}" data-tab="${id}">${esc(name)}${cnt}</button>`;
  }).join("");
  TABS.forEach(([id]) => document.getElementById("pane-" + id).classList.toggle("active", id === activeTab));

  const errBanner = fe.length ? `<div class="note stop"><b class="lv">Fix first</b><span>${fe.length} field${fe.length === 1 ? " has" : "s have"} an error, so the files below may not work. See Checks.</span></div>` : "";
  $("#pane-workflow").innerHTML = errBanner + fileBlock(OUT.workflow.path, wf, "yaml", "workflow") + `<div class="hint">With every option at its default, this is byte for byte <code>templates/repo-pages.yml</code>. Shapes other than the template, such as the pull-request job, have not been run on GitHub.</div>`;
  $("#pane-config").innerHTML = (cfgText ? errBanner + fileBlock(OUT.config.path, cfgText, "json", "config") : `<div class="empty-file">No <code>.github/repo-pages.json</code> is needed. Every value is the default: the title is the repository's name, nothing extra is excluded, hidden files stay out and HTML is not sandboxed.</div>`) +
    (Object.keys(preserved).length ? `<div class="note info"><b class="lv">Kept</b><span>Unknown keys from the import are written back unchanged: ${Object.keys(preserved).map(k => `<code>${esc(k)}</code>`).join(", ")}. The generator ignores them.</span></div>` : "");
  $("#pane-dependabot").innerHTML = dep ? fileBlock(OUT.dependabot.path, dep, "yaml", "dependabot") + `<div class="hint">Copied from the README's Get updates section. If the repository already has a Dependabot file, add the github-actions entry to it instead.</div>` : `<div class="empty-file">No Dependabot file. It is offered when the workflow pins a commit. @v1 updates itself, and a fork is yours to update.</div>`;
  $("#pane-checks").innerHTML = `<div class="notes">${C.map(c => `<div class="note ${c.lv}"><b class="lv">${{ stop: "Stop", warn: "Warn", info: "Note" }[c.lv]}</b><span>${c.html}</span></div>`).join("")}</div>`;
  $("#pane-summary").innerHTML = summaryHtml(C, list, cfgText, dep);
  $("#pane-inventory").innerHTML = inventoryHtml();
  // Preflight notes beside the repository facts
  const pf = preflight(S);
  $("#preflightNotes").innerHTML = `<div class="note ${pf.ok ? "ok" : "stop"}"><b class="lv">${esc(RELEASE.tag)}</b><span>${esc(pf.text)}</span></div>`;
  renderFiles(list);
}
function summaryHtml(C, list, cfgText, dep) {
  const s = S, items = [];
  const name = s.title || s.repo.split("/")[1] || "the repository";
  const pf = preflight(s);
  const trig = [];
  if (s.push) trig.push(`every push to <code>${esc(s.branch)}</code>`);
  if (s.dispatch) trig.push("a manual run from the Actions tab");
  if (s.schedule) trig.push(`a schedule (<code>${esc(s.cron)}</code>, UTC)`);
  if (s.workflowRun) trig.push(`a successful run of ${esc(s.workflowRunNames)}`);
  const andList = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
  items.push(trig.length ? `It rebuilds the site on ${andList(trig)}.` : "No trigger is on, so it never runs.");
  if (s.pr) items.push(`Pull requests into <code>${esc(s.branch)}</code> build the site to prove it works, and publish nothing.`);
  items.push(s.pin === "v1" ? "It follows <code>@v1</code>, so each v1 release arrives on the next rebuild." : s.pin === "sha" ? `It runs one pinned commit${s.shaLabel ? ` (${esc(s.shaLabel)})` : ""}. Nothing changes until you update the pin${dep ? ", and Dependabot opens a pull request for each release" : ""}.` : `It runs your fork, <code>${esc(s.forkRepo)}@${esc(s.forkRef)}</code>.`);
  items.push(pf.ok ? (s.deploy ? "The action's preflight allows the deploy." + (pf.text === "Publishes." ? "" : " " + esc(pf.text.replace(/^Publishes[,.]\s*/, ""))) : esc(pf.text)) : `<b>The preflight refuses to publish.</b> ${esc(pf.text)}`);
  if (s.deploy) items.push(s.repoVis === "public" || s.siteVis !== "private" ? "The site is public on the internet." : "The site is private. Only people with read access to the repository can open it.");
  items.push(`The site is titled “${esc(name)}”${s.title ? "" : ", the repository's name"}${s.description ? `, with the description “${esc(s.description)}”` : ""}.`);
  const ex = cleanExclude(s.exclude);
  items.push(`It publishes every tracked regular file except <code>.github/**</code>, ${s.includeHidden ? "" : "hidden files, "}<code>.DS_Store</code> and <code>.gitkeep</code> files${ex.length ? `, and ${ex.map(p => `<code>${esc(p)}</code>`).join(", ")}` : ""}. Symlinks and submodules are skipped.`);
  items.push(s.sandboxHtml ? "HTML pages run in a sandbox inside the viewer, with no access to the site's origin." : "HTML pages run on the site's own origin.");
  if (list) { const n = list.out.filter(r => r.status === "pub" || r.status === "flag").length; items.push(`From the pasted list, ${n} of ${list.out.length} files would be published.`); }
  const steps = [];
  steps.push(`Commit <code>.github/workflows/repo-pages.yml</code>${cfgText ? " and <code>.github/repo-pages.json</code>" : ""}${dep ? " and <code>.github/dependabot.yml</code>" : ""}, on a branch, through a pull request.`);
  steps.push(`Set <b>Settings &gt; Pages &gt; Source</b> to <b>GitHub Actions</b>, or run <code>gh api -X POST "repos/${esc(s.repo)}/pages" -f build_type=workflow</code>.`);
  if (s.siteVis === "private") steps.push("Check that GitHub Pages visibility is Private before the first deploy.");
  steps.push("After the merge, open the run's summary page. It lists every file the run published.");
  const nStop = C.filter(c => c.lv === "stop").length;
  return `${nStop ? `<div class="note stop"><b class="lv">Stop</b><span>${nStop} check${nStop === 1 ? "" : "s"} would stop the run or expose something. See Checks.</span></div>` : `<div class="note ok"><b class="lv">OK</b><span>Nothing in this setup stops the run. Read the warnings in Checks.</span></div>`}
    <div class="summary"><h3>What this setup does</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul><h3>Next steps</h3><ol>${steps.map(i => `<li>${i}</li>`).join("")}</ol>
    <h3>Files</h3><ul><li><code>.github/workflows/repo-pages.yml</code>, always.</li><li><code>.github/repo-pages.json</code>, ${cfgText ? "with the keys you changed." : "not needed."}</li><li><code>.github/dependabot.yml</code>, ${dep ? "for pinned updates." : "not needed."}</li></ul></div>`;
}
function inventoryHtml() {
  const rows = OPTIONS.filter(o => o.where !== "tool");
  const def = o => o.type === "fixed" ? "fixed" : o.id === "token" ? "github.token" : o.id === "title" ? "repository name" : Array.isArray(o.def) ? "[]" : o.def === "" ? '""' : String(o.def);
  return `<div class="hint" style="margin:0">${rows.length} options, from the same registry the form uses.</div><div class="table-wrap" style="max-height:none"><table><thead><tr><th>Option</th><th>Where</th><th>Key</th><th>Type</th><th>Default</th><th>In</th><th>Source</th></tr></thead><tbody>${rows.map(o => `<tr><td>${esc(o.label)}</td><td>${o.where}</td><td class="path">${esc(o.key || "")}</td><td>${o.type}${o.values ? ": " + o.values.map(v => esc(JSON.stringify(v[0]))).join(", ") : ""}</td><td class="path">${esc(def(o))}</td><td>${o.where === "context" ? "-" : o.since && o.since !== FIRST_RELEASE ? esc(o.since) + " and later" : "every release"}</td><td>${esc(o.source || "")}</td></tr>`).join("")}</tbody></table></div>`;
}
function renderFiles(list) {
  const counts = $("#fileCounts"), table = $("#fileTable"), pt = $("#patternTable");
  if (!list) { counts.innerHTML = ""; pt.innerHTML = ""; table.innerHTML = `<div class="empty-file" style="border:none">Paste a file list or load a sample.</div>`; return; }
  const { out, pats } = list;
  const groups = [["all", "All", () => true], ["pub", "Published", r => r.status === "pub" || r.status === "flag"], ["flag", "Flagged", r => r.flags.length > 0], ["hid", "Hidden", r => r.status === "hid"], ["exc", "Excluded", r => r.status === "exc"], ["skip", "Not regular", r => r.status === "skip"], ["stop", "Collisions", r => r.status === "stop"]];
  counts.innerHTML = groups.map(([id, name, f]) => `<button class="count${fileFilter === id ? " selected" : ""}" data-filter="${id}">${name} <b>${out.filter(f).length}</b></button>`).join("");
  const f = (groups.find(g => g[0] === fileFilter) || groups[0])[2];
  const shown = out.filter(f);
  const label = { pub: ["pub", "Published"], flag: ["flag", "Published, check"], hid: ["hid", "Hidden"], exc: ["exc", "Excluded"], skip: ["skip", "Skipped"], stop: ["stop", "Build stops"] };
  table.innerHTML = shown.length ? `<table><thead><tr><th>Path</th><th>Result</th><th>Why</th></tr></thead><tbody>${shown.slice(0, 600).map(r => `<tr><td class="path">${esc(r.path)}</td><td><span class="st ${label[r.status][0]}">${label[r.status][1]}</span></td><td>${esc([r.reason].concat(r.flags).filter(Boolean).join(". ") || "Tracked regular file")}</td></tr>`).join("")}${shown.length > 600 ? `<tr><td colspan="3">... and ${shown.length - 600} more</td></tr>` : ""}</tbody></table>` : `<div class="empty-file" style="border:none">No file in this group.</div>`;
  pt.innerHTML = `<div class="table-wrap" style="max-height:12rem"><table><thead><tr><th>Pattern</th><th>From</th><th>Matches</th><th>Lint</th></tr></thead><tbody>${pats.map(x => `<tr><td class="path">${esc(x.p)}</td><td>${x.def ? "default" : "yours"}</td><td>${x.hits}</td><td>${esc((x.lint || []).join(" ") || "-")}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ═════════════ Import ═════════════ */
function validateImport(text) {
  const notes = $("#importNotes");
  if (!text.trim()) { notes.innerHTML = ""; return null; }
  let obj;
  try { obj = JSON.parse(text); } catch (e) { notes.innerHTML = `<div class="note stop"><b class="lv">Stop</b><span>${esc(CONFIG_FILE)} is not valid JSON: ${esc(e.message)}</span></div>`; return null; }
  const errs = checkConfig(obj, CONFIG_FILE);
  if (errs.length) { notes.innerHTML = errs.map((e, i) => `<div class="note stop"><b class="lv">${i === 0 ? "Stop" : "Also"}</b><span>${esc(e)}${i === 0 && errs.length > 1 ? " The generator stops here and reports only this one." : ""}</span></div>`).join(""); return null; }
  const known = CONFIG_TYPES.map(c => c[0]), unknown = Object.keys(obj).filter(k => !known.includes(k));
  notes.innerHTML = `<div class="note ok"><b class="lv">Valid</b><span>The generator would accept this file.${unknown.length ? ` It ignores ${unknown.map(k => `<code>${esc(k)}</code>`).join(", ")}.` : ""}</span></div>`;
  return obj;
}
function applyImport(obj) {
  S = Object.assign(S, { title: "", description: "", exclude: [], includeHidden: false, sandboxHtml: false });
  ["title", "description", "includeHidden", "sandboxHtml"].forEach(k => { if (k in obj) S[k] = obj[k]; });
  if ("exclude" in obj) S.exclude = obj.exclude.slice();
  preserved = {};
  Object.keys(obj).filter(k => !CONFIG_TYPES.some(c => c[0] === k)).forEach(k => preserved[k] = obj[k]);
  presetId = "";
  setInputsFromState(); syncForm(); renderOutputs();
  toast("Loaded into the form");
}

/* ═════════════ Events ═════════════ */
function update() { syncForm(); renderOutputs(); }
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.opt) { S[b.dataset.opt] = JSON.parse(b.dataset.val); presetId = ""; update(); }
  else if (b.dataset.toggle) { S[b.dataset.toggle] = !S[b.dataset.toggle]; presetId = ""; update(); }
  else if (b.dataset.preset) { const p = PRESETS.find(x => x.id === b.dataset.preset); S = Object.assign(defaults(), JSON.parse(JSON.stringify(p.set))); preserved = {}; presetId = p.id; setInputsFromState(); update(); toast("Preset: " + p.name); }
  else if (b.dataset.tab) { activeTab = b.dataset.tab; store("rps.tab", activeTab); renderOutputs(); }
  else if (b.dataset.filter) { fileFilter = b.dataset.filter; renderOutputs(); }
  else if (b.dataset.sample) { LIST_TEXT = b.dataset.sample === "plain" ? SAMPLE_PLAIN : b.dataset.sample === "modes" ? SAMPLE_MODES : ""; $("#listBox").value = LIST_TEXT; fileFilter = "all"; renderOutputs(); }
  else if (b.dataset.copy) copyText(OUT[b.dataset.copy].text);
  else if (b.dataset.download) download(OUT[b.dataset.download]);
  else if (b.id === "importBtn") { const o = validateImport($("#importBox").value); if (o) applyImport(o); }
  else if (b.dataset.settheme) setTheme(b.dataset.settheme);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.text) { S[t.dataset.text] = t.value; presetId = ""; update(); }
  else if (t.dataset.num) { const n = t.value === "" ? NaN : Number(t.value); S[t.dataset.num] = BY_ID[t.dataset.num].step ? Math.round(n * 100) / 100 : n; presetId = ""; update(); }
  else if (t.dataset.list) { S[t.dataset.list] = t.value.split(/\r?\n/); presetId = ""; update(); }
  else if (t.id === "listBox") { LIST_TEXT = t.value; renderOutputs(); }
  else if (t.id === "importBox") validateImport(t.value);
});
document.addEventListener("change", e => {
  if (e.target.id !== "importFile" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { $("#importBox").value = r.result; const o = validateImport(r.result); if (o) applyImport(o); };
  r.readAsText(e.target.files[0]);
});
function copyText(text) {
  const done = () => toast("Copied");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Copy failed. Select the text instead."); } ta.remove(); }
function download(f) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([f.text], { type: "text/plain" })); a.download = f.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ═════════════ Theme ═════════════ */
let theme = "system";
try { const t = JSON.parse(localStorage.getItem("rps.theme")); if (["light", "dark", "system"].includes(t)) theme = t; } catch (e) {}
function setTheme(t) {
  theme = t; store("rps.theme", t);
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("#themeTrack").innerHTML = [["light", "Light"], ["dark", "Dark"], ["system", "System"]].map(([v, l]) => `<button class="opt${v === theme ? " selected" : ""}" data-settheme="${v}" aria-pressed="${v === theme}" style="flex:0 0 auto">${l}</button>`).join("");
}

/* ═════════════ Check hook: tests/run_setup_checks.mjs reads the page's rules through this object. Nothing on the page uses it ═════════════ */
window.__setup = { RELEASE, PRESETS, samples: { plain: SAMPLE_PLAIN, modes: SAMPLE_MODES }, DEFAULT_EXCLUDE, RESERVED, VIEWER_DIR, REGULAR_MODES, CONFIG_TYPES: CONFIG_TYPES.map(c => [c[0], c[2]]), preflight: patch => preflight(Object.assign(defaults(), patch)),  get state() { return S; }, set: patch => { Object.assign(S, patch); setInputsFromState(); update(); }, reset: () => { S = defaults(); preserved = {}; setInputsFromState(); update(); }, buildWorkflow: () => buildWorkflow(S), configText: () => OUT.config.text, classify: text => classify(parseList(text).rows, S).out.map(r => [r.path, r.status, r.reason]), checkConfig, globToRegex: p => globToRegex(p).source, OPTIONS, inventory: () => OPTIONS.filter(o => o.where !== "tool").map(o => ({ id: o.id, label: o.label, where: o.where, key: o.key || "", type: o.type, def: o.def, values: o.values ? o.values.map(v => v[0]) : null, since: o.since || "", source: o.source || "" })) };

setTheme(theme);
$("#ruleStamp").textContent = `Rules from repo-pages ${RELEASE.tag}`;
renderForm();
syncForm();
renderOutputs();
</script>
