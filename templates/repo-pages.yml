# Publishes this repository as a repo-pages site on GitHub Pages.
# Copy this file to .github/workflows/repo-pages.yml in the repository you want to publish.
# https://github.com/prisant-labs/repo-pages
#
# Before the first run, set Settings > Pages > Source to "GitHub Actions".
# Change "main" below if your default branch has another name.
name: Repo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # A site only picks up repo-pages fixes when it rebuilds. Uncomment this line
  # to rebuild every Monday, which suits a repository that rarely changes.
  # schedule: [{ cron: '0 6 * * 1' }]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: repo-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        uses: prisant-labs/repo-pages@v1
